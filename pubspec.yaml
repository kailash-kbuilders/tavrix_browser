name: tavrix_browser
description: Tavrix Browser - Browse Beyond Limits. A premium mobile browser built with Flutter.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  provider: 6.1.5+1
  flutter_inappwebview: 6.1.5
  sqflite: 2.4.5
  path: 1.9.1
  path_provider: 2.1.6
  shared_preferences: 2.5.6
  permission_handler: 13.0.2
  flutter_local_notifications: 22.3.3
  dio: 5.11.1
  url_launcher: 6.3.3
  share_plus: 13.3.1
  open_filex: 5.0.0
  intl: 0.20.3
  uuid: 4.6.0
  flutter_secure_storage: 11.2.0
  speech_to_text: 7.5.0
  mobile_scanner: 7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_mark.png
